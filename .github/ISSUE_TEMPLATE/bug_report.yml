name: Bug report
description: Report a reproducible problem with volto
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include secrets, full session transcripts, or
        unredacted file contents. For security vulnerabilities, use the private process in
        SECURITY.md instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps to reproduce, ideally a small repo or a command sequence.
      placeholder: |
        1. Run `npx @voltojs/gateway`
        2. Select workspace ...
        3. Ask the agent ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `npx @voltojs/gateway --version`, or the commit hash.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Other (unsupported)
    validations:
      required: true
  - type: dropdown
    id: permission-mode
    attributes:
      label: Permission mode
      options:
        - ask
        - read-only
        - workspace-write
        - danger-full-access
        - not sure
    validations:
      required: true