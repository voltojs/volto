name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      # Web copy must come from the message catalogs (Task 11): the scanner
      # strips comments and honours scripts/i18n-allowlist.json.
      - name: Check hardcoded i18n copy
        run: pnpm run check:i18n

      - name: Test
        run: pnpm turbo run test

      # M11 "重放式 eval" acceptance as a CI gate: replay the recorded
      # trajectories through the pure reducer and assert full (state, effects)
      # consistency. The live provider integration tests skip automatically
      # when no OPENAI_API_KEY is present (see provider vitest configs).
      - name: Replay regression (eval trajectories)
        run: |
          pnpm --filter @voltojs/eval build
          pnpm --filter @voltojs/eval replay

      - name: Core zero-deps check
        run: node scripts/check-core-zero-deps.mjs

      # User docs gate: generated reference pages must match their inputs,
      # links/anchors must resolve, every tool must have a Chinese note, the
      # integrator examples must compile, and a user-visible surface change
      # must be acknowledged in the same commit.
      - name: User docs check
        run: |
          pnpm turbo run build
          pnpm docs:check
