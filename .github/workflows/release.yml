# Publishes the `@voltojs/*` packages to the public npm registry.
#
# Triggered manually or by pushing a `v*` tag. The version bump itself is still
# done locally with changesets (see docs/user/integrating/guides/publishing.md):
# this workflow only packs, gates and publishes what is already on the ref.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # The version comes from `packageManager` in package.json; passing
      # `with.version` as well makes the action refuse to run.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Configures the runner for `npm publish`; the token is passed below.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `check:pack` is the release build: build:fresh (clean rebuild of every
      # package) + web:export + the publish-manifest and tarball gates. Running
      # it here means the artifacts published by the step below are exactly the
      # ones the gate inspected, and the build never runs twice.
      - name: Pack gate (clean build + manifest + tarball contents)
        run: pnpm check:pack

      # The user docs gate: generated pages vs. their inputs, links, and the
      # integrator examples. Same check CI runs; a tag should not ship docs
      # that no longer match the code.
      - name: User docs check
        run: pnpm docs:check

      # `publishConfig.access: public` is what makes the scoped packages installable
      # by anyone; npm rejects a scoped publish that does not opt in.
      - name: Publish to npm
        run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}