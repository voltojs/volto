name: "Agent Core"
description: "Run an AI agent using agent-core"
inputs:
  prompt:
    description: "The prompt to send to the agent"
    required: true
  model:
    description: "The model to use (default: gpt-4o)"
    required: false
    default: "gpt-4o"
  api_key:
    description: "OpenAI API key (or set OPENAI_API_KEY env)"
    required: false
  cwd:
    description: "Working directory for file operations"
    required: false
    default: "."
outputs:
  response:
    description: "The agent's response"
  status:
    description: "The final status (done/error)"
  error:
    description: "Error message if status is error"
runs:
  using: "node20"
  main: "dist/main.js"
