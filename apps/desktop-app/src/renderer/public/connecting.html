<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volto Desktop · 正在连接</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        background: light-dark(#fafafa, #0b0b0c);
        color: light-dark(#18181b, #e4e4e7);
      }
      main { text-align: center; padding: 32px; }
      .mark { font-weight: 700; font-size: 28px; letter-spacing: -0.02em; }
      .mark span { color: #d65a28; }
      p { margin: 14px 0 0; font-size: 14px; color: light-dark(#71717a, #a1a1aa); }
      .pulse { margin: 22px auto 0; width: 8px; height: 8px; border-radius: 999px; background: #d65a28; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Volto<span>.</span></div>
      <p>正在连接网关…</p>
      <div class="pulse"></div>
    </main>
  </body>
</html>
