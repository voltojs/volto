<?xml version="1.0" encoding="UTF-8"?>
<!--
  Volto Desktop 应用图标占位（SVG 源）
  - 一个圆角矩形 + 字母 V 表达 "Volto"
  - 配色：渐变蓝紫（与 Tailwind primary 兼容）
  - 1024×1024 矩形画布，便于 electron-icon-maker 派生各平台尺寸

  最终生成 .icns / .ico / .png 的步骤见同目录 README.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="200" ry="200" fill="url(#bg)"/>
  <path
    d="M 280 280 L 512 760 L 744 280"
    fill="none"
    stroke="#ffffff"
    stroke-width="80"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
